[package]
name = "emtk-core"
version = "0.1.22"
edition = "2021"
authors = ["Thomas-Otavio Peulen"]
license = "MIT"
description = "High-performance immediate-mode GUI core engine for EMTK"

[dependencies]
emtk-font = { path = "../emtk-font" }
bumpalo = "3.16"
ahash = "0.8"
glam = "0.29"
bytemuck = { version = "1.18", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
png = "0.17"
