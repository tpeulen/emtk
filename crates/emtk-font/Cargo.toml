[package]
name = "emtk-font"
version = "0.1.22"
edition = "2021"
authors = ["Thomas-Otavio Peulen"]
license = "MIT"
description = "Hybrid font engine for EMTK: embedded baked atlas + dynamic TTF rasterizer"

[dependencies]
fontdue = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
png = "0.17"
